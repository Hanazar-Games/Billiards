# Nakama integration (D051): brings up the local stack (infra/docker-compose.yml)
# with the development values of infra/.env.example and runs the bot tests.
name: Integration (Nakama)

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nakama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp infra/.env.example infra/.env
      - run: npm run infra:up
      - run: npm test -w services/nakama
      - name: Integration tests
        run: npm run test:integration -w services/nakama 2>&1 | tee integration.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Annotations are readable without signing in (the job log is not).
      - name: Test summary
        if: always()
        shell: bash
        run: |
          [ -f integration.log ] || exit 0
          grep -E '^(✔|✖|ℹ (tests|pass|fail))' integration.log | head -40 | while IFS= read -r line; do echo "::notice title=integration::$line"; done
          grep -E 'Error|expected|actual' integration.log | head -20 | while IFS= read -r line; do echo "::error title=integration::$line"; done
      - name: Nakama logs
        if: failure()
        shell: bash
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env logs nakama > nakama.log 2>&1 || true
          cat nakama.log
          grep -iE '"level":"(error|warn)"|panic' nakama.log | head -20 | while IFS= read -r line; do echo "::warning title=nakama::${line:0:300}"; done
      - name: Stop the stack
        if: always()
        run: npm run infra:down
