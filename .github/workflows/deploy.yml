name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The Pages path comes from the repository name (D066), for the build and its check.
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome system dependencies
        run: sudo npx puppeteer browsers install chrome --install-deps

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: npm run build:pages
        env:
          # The online client's server (D065): repository variables, empty until the deploy exists.
          VITE_NAKAMA_URL: ${{ vars.NAKAMA_URL }}
          VITE_NAKAMA_SERVER_KEY: ${{ vars.NAKAMA_SERVER_KEY }}

      - name: Verify Pages artifact
        run: npm run test:pages

      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        run: npm run test:pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
