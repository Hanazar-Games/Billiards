# F0 spike: runs the benchmark module inside the real Nakama JS runtime (goja).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name sim-bench
        --database.address postgres:localdb@postgres:5432/nakama
        --runtime.js_entrypoint index.js
        --logger.level INFO
        --socket.read_timeout_ms 1800000
        --socket.write_timeout_ms 1800000
        --socket.idle_timeout_ms 1800000
    volumes:
      - ../dist/nakama:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7350:7350"
