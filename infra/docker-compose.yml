# Local development stack (F3, F4-A): PostgreSQL 16 + Nakama 3.41.0 running the
# billiards server module (services/nakama/build) + the shot simulation service
# (services/sim, D059). Same images as the F0 spike.
# Keys come from infra/.env (copied from .env.example: development values only).
# Ports bind to 127.0.0.1 unless NAKAMA_BIND says otherwise (a test server on the
# local network sets NAKAMA_BIND=0.0.0.0; see docs/f3/servidor-local.md).
name: billiards

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Only the Nakama container talks to it, over this network: no published port.
  # The image copies services/sim/build/server.mjs (npm run infra:up builds it).
  sim:
    build: ../services/sim
    environment:
      SIM_SECRET: "${SIM_SECRET:?SIM_SECRET is missing, copy it from infra/.env.example to infra/.env}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
      sim:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --socket.server_key ${NAKAMA_SERVER_KEY}
        --runtime.http_key ${NAKAMA_HTTP_KEY}
        --session.encryption_key ${NAKAMA_SESSION_KEY}
        --session.refresh_encryption_key ${NAKAMA_SESSION_KEY}-refresh
        --console.password ${NAKAMA_CONSOLE_PASSWORD}
        --runtime.env "SIM_URL=http://sim:8080"
        --runtime.env "SIM_SECRET=${SIM_SECRET}"
    volumes:
      - ./nakama/local.yml:/nakama/data/local.yml:ro
      - ../services/nakama/build:/nakama/data/modules:ro
    ports:
      - "${NAKAMA_BIND:-127.0.0.1}:7350:7350"
      - "${NAKAMA_BIND:-127.0.0.1}:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
