# Nakama configuration for local development (F3). Keys are passed on the
# command line from infra/.env (see docker-compose.yml), never written here.
name: billiards-local

logger:
  level: INFO

runtime:
  js_entrypoint: index.js

session:
  token_expiry_sec: 7200

# A fast matchmaker so tests pair bots within seconds.
matchmaker:
  interval_sec: 1
  max_intervals: 3
